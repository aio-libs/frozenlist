---

codecov:
  notify:
    after_n_builds: 19  # The number of test matrix+lint jobs uploading coverage
    wait_for_ci: false

  require_ci_to_pass: false

  token: >-  # notsecret  # repo-scoped, upload-only, stability in fork PRs
    9294d8cc-5520-4c49-b524-5f9e30bdd09b

comment:
  require_changes: true

coverage:
  range: 100..100
  status:
    patch:
      default:
        target: 100%
    project:
      default:
        target: 100%
      lib-combined:
        paths:
        - frozenlist/
        target: 100%
      lib-cython:
        paths:
        - frozenlist/*.pyx
        - frozenlist/**/*.pyx
        target: 100%
      lib-python:
        paths:
        - frozenlist/*.py
        - frozenlist/**/*.py
        target: 100%
      packaging:
        paths:
        - packaging/
        target: 75.24%
      tests:
        paths:
        - tests/
        target: 100%

...
